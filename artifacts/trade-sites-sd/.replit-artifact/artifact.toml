kind = "web"
previewPath = "/"
title = "Trade Sites SD"
description = "A professional static portfolio and service website for Kevin Ibarra's San Diego web design side hustle."
version = "1.0.0"
id = "artifacts/trade-sites-sd"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24325

[services.development]
run = "node -e 'const fs=require(\"fs\");const http=require(\"http\");const path=require(\"path\");const root=fs.existsSync(\"index.html\")?process.cwd():path.resolve(\"artifacts/trade-sites-sd\");const port=Number(process.env.PORT);http.createServer((req,res)=>{let p=decodeURIComponent((req.url||\"/\").split(\"?\")[0]);if(p===\"/\"||!path.extname(p))p=\"/index.html\";const file=path.join(root,p);if(!file.startsWith(root)||!fs.existsSync(file)){res.statusCode=404;res.end(\"Not found\");return}const mime={\".html\":\"text/html; charset=utf-8\",\".css\":\"text/css; charset=utf-8\",\".js\":\"text/javascript; charset=utf-8\",\".svg\":\"image/svg+xml\"}[path.extname(file)]||\"application/octet-stream\";res.setHeader(\"Content-Type\",mime);res.end(fs.readFileSync(file))}).listen(port,\"0.0.0.0\")'"

[services.production]
serve = "static"
publicDir = "artifacts/trade-sites-sd"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24325"
BASE_PATH = "/"
